# gitleaks configuration: the default rules plus one allowlist, so a scan of the
# working tree or of any commit gives the same answer.
#
# The Dockerfile pins the public OpenPGP fingerprints of the signing keys it
# checks downloads against. Their publishers print them so anyone can verify the
# keys. The generic-api-key rule matches them only because they are 40-character
# hex strings assigned to a *_KEYS or *_KEY_FPR variable.

[extend]
useDefault = true

[[allowlists]]
description = "Public OpenPGP key fingerprints pinned in the Dockerfile"
targetRules = ["generic-api-key"]
paths = ['''(^|/)Dockerfile$''']
regexTarget = "line"
regexes = ['''(_KEY_FPR=|_KEYS=")[0-9A-F]{40}\b''']
