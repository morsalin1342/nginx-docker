# The WAF configuration this image ships. **Nothing loads it by default.**
#
# Installed as /etc/nginx/modsecurity/main.conf. To use it, in the http, server
# or location context of your nginx configuration:
#
#     modsecurity on;
#     modsecurity_rules_file /etc/nginx/modsecurity/main.conf;
#
# The order below is the order ModSecurity and the Core Rule Set document:
# the engine's own settings first, then the CRS setup, then the rules, with the
# CRS plugin hooks around them.

# ModSecurity's own modsecurity.conf-recommended, copied unchanged from the
# ModSecurity source this image's libmodsecurity was built from. Among other
# things it holds rules 200002 and 200003, which reject request bodies that
# fail to parse or break strict multipart parsing: the CRS rules cannot inspect
# a body the engine could not parse, so those two rules are what stop it.
Include /etc/nginx/modsecurity/modsecurity.conf

# Detection only: matches go to the audit log, nothing is blocked. To block,
# put `modsecurity_rules 'SecRuleEngine On';` in your nginx configuration
# **before** the modsecurity_rules_file line, or mount your own copy of this
# file. Before, because when one nginx block sets SecRuleEngine twice, the
# connector keeps the first value it loaded.
SecRuleEngine DetectionOnly

# The OWASP Core Rule Set.
Include /etc/nginx/modsecurity/crs-setup.conf
Include /etc/nginx/modsecurity/plugins/*-config.conf
Include /etc/nginx/modsecurity/plugins/*-before.conf
Include /etc/nginx/modsecurity/rules/*.conf
Include /etc/nginx/modsecurity/plugins/*-after.conf
