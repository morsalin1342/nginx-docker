name: Docker Publish

on:
  push:
    branches: [ "master" ]
    paths:
      - 'Dockerfile'
      - 'README.md'
      - 'README.dockerhub.md'
      - 'README.dockerhub-org.md'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Extract Caddy version from Dockerfile
        id: get_version
        run: |
          # The version lives in an ARG, not a FROM line: the final stage is
          # `FROM nginx:${NGINX_VERSION}-${DEBIAN_RELEASE}`, so grepping FROM
          # would return the literal placeholder rather than a version.
          VERSION=$(grep -oP '^ARG NGINX_VERSION=\K[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Could not extract version from Dockerfile."
            exit 1
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/nginx:${{ steps.get_version.outputs.version }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/nginx:latest
            ${{ secrets.DOCKER_HUB_ORG }}/nginx:${{ steps.get_version.outputs.version }}
            ${{ secrets.DOCKER_HUB_ORG }}/nginx:latest
          # Enable GHA caching for faster builds.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update_readme:
    # This job runs only after build_and_publish has succeeded.
    needs: build_and_publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Update Docker Hub description (personal repo)
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          repository: ${{ secrets.DOCKER_HUB_USERNAME }}/nginx
          readme-filepath: ./README.dockerhub.md

      - name: Update Docker Hub description (org repo)
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          repository: ${{ secrets.DOCKER_HUB_ORG }}/nginx
          readme-filepath: ./README.dockerhub-org.md
