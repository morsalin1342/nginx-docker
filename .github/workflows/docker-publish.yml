name: Docker Publish

on:
  push:
    branches: [ "master" ]
    paths:
      - 'Dockerfile'
      - 'README.md'
      - 'README.dockerhub.md'
      - 'README.dockerhub-org.md'
      - 'LICENSE'
  # A pull request builds and scans the image. It never logs in and never pushes.
  pull_request:
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker-publish.yml'
  # Weekly rebuild, so Debian security updates and a moved base image reach the
  # published tags without waiting for a commit. It writes the same tags as a push.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    if: github.repository == 'morsalin1342/nginx-docker'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Extract nginx version from Dockerfile
        id: get_version
        run: |
          # The version lives in an ARG, not a FROM line: the final stage is
          # `FROM nginx:${NGINX_VERSION}-${DEBIAN_RELEASE}`, so grepping FROM
          # would return the literal placeholder rather than a version.
          VERSION=$(grep -oP '^ARG NGINX_VERSION=\K[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Could not extract version from Dockerfile."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build into the runner's Docker daemon only. Nothing leaves the runner until
      # the scan below has passed.
      - name: Build the image locally
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: local/nginx:scan
          # Enable GHA caching for faster builds.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A fixable critical vulnerability fails the run before anything is pushed.
      - name: Scan the image for fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/nginx:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Write the SBOM
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/nginx:scan
          format: spdx-json
          output: sbom.spdx.json
          exit-code: '0'

      - name: Keep the SBOM
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: sbom-nginx-${{ steps.get_version.outputs.version }}
          path: sbom.spdx.json

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Same context and inputs as the local build on the same builder, so every
      # layer comes from that build's cache: what is pushed is what was scanned.
      # One build writes every tag, so both namespaces get the same digest.
      - name: Push the scanned image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            morsalin1342/nginx:${{ steps.get_version.outputs.version }}
            morsalin1342/nginx:latest
            easydigital/nginx:${{ steps.get_version.outputs.version }}
            easydigital/nginx:latest
          cache-from: type=gha

      - name: Check the pushed layers are the scanned layers
        if: github.event_name != 'pull_request'
        env:
          PUSHED: easydigital/nginx:${{ steps.get_version.outputs.version }}
        run: |
          scanned=$(docker image inspect local/nginx:scan --format '{{json .RootFS.Layers}}' | jq -c .)
          pushed=$(docker buildx imagetools inspect "$PUSHED" --format '{{json .Image.RootFS.DiffIDs}}' | jq -c .)
          if [ "$scanned" != "$pushed" ]; then
            echo "::error::The pushed image's layers differ from the scanned image's layers."
            echo "scanned: $scanned"
            echo "pushed:  $pushed"
            exit 1
          fi

  update_readme:
    # This job runs only after build_and_publish has succeeded, and never for a pull request.
    needs: build_and_publish
    runs-on: ubuntu-latest
    if: github.repository == 'morsalin1342/nginx-docker' && github.event_name != 'pull_request'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Update Docker Hub description (personal repo)
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          repository: morsalin1342/nginx
          readme-filepath: ./README.dockerhub.md
          short-description: 'nginx with ModSecurity 3, Brotli, Zstandard, GeoIP2, VTS and OpenTelemetry dynamic modules'

      - name: Update Docker Hub description (org repo)
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          repository: easydigital/nginx
          readme-filepath: ./README.dockerhub-org.md
          short-description: 'nginx with ModSecurity 3, Brotli, Zstandard, GeoIP2, VTS and OpenTelemetry dynamic modules'
